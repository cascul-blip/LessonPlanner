name: Build Windows

# Builds LessonPlanner.exe and lessonplanner-mcp.exe on a Windows runner.
# - Push a tag like v0.2.0 to publish them as a GitHub Release.
# - Or run it by hand from the Actions tab; the zip is then a downloadable artifact.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .[dev]

      - name: Test
        run: python -m pytest -q

      - name: Build app
        run: pyinstaller --noconfirm --windowed --icon packaging/icon.ico --add-data "lessonplanner/gui/resources;lessonplanner/gui/resources" --paths . --name LessonPlanner packaging/launch_app.py

      - name: Build MCP server
        run: pyinstaller --noconfirm --onefile --console --paths . --name lessonplanner-mcp packaging/launch_mcp.py

      - name: Smoke test
        run: |
          python packaging/smoke_test_app.py dist/LessonPlanner/LessonPlanner.exe
          python packaging/smoke_test_mcp.py dist/lessonplanner-mcp.exe

      - name: Package
        shell: pwsh
        run: |
          Copy-Item dist/lessonplanner-mcp.exe dist/LessonPlanner/
          Copy-Item README.md dist/LessonPlanner/
          Compress-Archive -Path dist/LessonPlanner -DestinationPath LessonPlanner-windows.zip

      - uses: actions/upload-artifact@v7
        with:
          name: LessonPlanner-windows
          path: LessonPlanner-windows.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: LessonPlanner-windows.zip
          generate_release_notes: true
